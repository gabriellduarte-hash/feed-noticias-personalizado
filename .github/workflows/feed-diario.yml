name: Feed diário

on:
  schedule:
    # 09:00 UTC = 06:00 em Brasília (UTC-3, sem horário de verão hoje em dia)
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # permite rodar manualmente também, pela aba Actions do GitHub

jobs:
  rodar-pipeline:
    # Versão fixa em vez de ubuntu-latest: o "latest" vira Ubuntu 26 em
    # 19/10/2026, e trocar de sistema sem aviso pode quebrar o pip/Python.
    # A atualização fica pra quando decidirmos testar.
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FEED_USER_ID: ${{ secrets.FEED_USER_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FEED_TO_EMAIL: ${{ secrets.FEED_TO_EMAIL }}
    steps:
      # v7 das duas: rodam em Node.js 24 (as v4/v5 usavam Node 20, que o
      # GitHub está aposentando — era esse o aviso nas execuções)
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar artigos
        working-directory: coletor
        run: python coletar.py

      # Vitrine da aba "Explorar" do hub. Se falhar, não deve impedir o
      # resumo e o e-mail do dia, que não dependem disso.
      - name: Coletar notícias do catálogo
        working-directory: coletor
        run: python coletar_catalogo.py
        continue-on-error: true

      - name: Gerar resumo
        working-directory: resumo
        run: python resumir.py

      - name: Enviar e-mail
        working-directory: envio
        run: python enviar.py
