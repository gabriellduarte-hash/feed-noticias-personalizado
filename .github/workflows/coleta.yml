name: Coleta de notícias

# De hora em hora: busca o que há de novo nas fontes dos usuários e nas
# do catálogo (aba Explorar), e classifica e agrupa em histórias, sem IA.
# Minuto 20 pra fugir do pico do começo da hora no GitHub.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch: {}

# Uma coleta por vez: se a anterior atrasar, a próxima espera em vez de
# rodar junto (e gravar/resumir os mesmos artigos duas vezes).
concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    # Versão fixa: o "latest" vira Ubuntu 26 em 19/10/2026
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Worker do Cloudflare (worker/leitor.js) que lê os sites que barram
      # as máquinas do GitHub (coletor/rede.py). Com ele, o passo do hub
      # fica de reserva.
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      # Senha da rota de coleta do hub (o mesmo valor na Vercel). Sem ela,
      # o passo "Sites que barram o GitHub" é pulado.
      COLETA_SECRET: ${{ secrets.COLETA_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip  # reaproveita os pacotes entre as execuções (roda toda hora)
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: Instalar dependências
        # versões fixas em constraints.txt (auditoria de 20/10)
        run: pip install -r requirements-nlp.txt -c constraints.txt

      # O modelo dos vetores (vetores.py, ~220 MB) baixa uma vez e fica
      # guardado aqui; sem isso, baixaria toda hora
      - uses: actions/cache@v6
        with:
          path: ~/.cache/daily-paper-modelos
          key: modelos-paraphrase-multilingual-MiniLM-L12-v2

      - name: Coletar fontes dos usuários
        working-directory: coletor
        run: python coletar.py
        timeout-minutes: 10

      # Vitrine da aba Explorar: se falhar, não pode impedir o resumo
      - name: Coletar notícias do catálogo
        working-directory: coletor
        run: python coletar_catalogo.py
        timeout-minutes: 10
        continue-on-error: true

      # Sites abertos que barram as máquinas do GitHub (sql/040): com o
      # Worker, os passos de coleta e de enriquecimento já leem esses sites
      # por ele. Sem o Worker, quem lê o feed e abre as páginas é o hub, na
      # Vercel.
      - name: Sites que barram o GitHub (coleta pelo hub)
        if: env.COLETA_SECRET != '' && env.WORKER_URL == ''
        run: |
          curl -sS --fail-with-body --max-time 90 -X POST \
            -H "Authorization: Bearer $COLETA_SECRET" \
            https://dailypaper.news/api/coletar-bloqueados
        timeout-minutes: 3
        continue-on-error: true

      # Abre a página das notícias novas pra pegar texto completo e imagem
      # (sql/025). Antes do resumo, pra IA ler a matéria inteira.
      - name: Enriquecer (texto completo e imagem)
        working-directory: coletor
        run: python enriquecer.py
        timeout-minutes: 10
        continue-on-error: true

      # Tira do texto o que não é matéria (anúncio, cookies, "siga no
      # WhatsApp", trechos que o site repete em toda matéria). Antes do
      # resumo, pra IA ler o texto limpo (sql/029).
      - name: Limpar textos
        working-directory: coletor
        run: python limpar_textos.py
        timeout-minutes: 5
        continue-on-error: true

      # Sem IA (sql/044 e 045): categoria e temas pela taxonomia
      # (taxonomia.py) e pela categoria do site; nomes pelo spaCy
      # (entidades.py). A IA só resume o que vai pro e-mail, na hora do
      # envio (workflow "Resumo diário").
      - name: Classificar (sem IA)
        working-directory: coletor
        run: python classificar.py
        timeout-minutes: 5

      # Histórias: notícias de sites diferentes sobre o mesmo acontecimento
      # (nota de semelhança, com vetores que juntam português e inglês).
      # Define o Trending e a relevância no e-mail. A primeira rodada
      # depois do 045 calcula os vetores da janela toda (alguns minutos).
      - name: Agrupar histórias (sem IA)
        working-directory: coletor
        run: python agrupar.py
        timeout-minutes: 10
