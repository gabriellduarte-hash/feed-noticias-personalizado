name: Fonte nova

# Disparado pelo hub quando alguém adiciona uma fonte (ou à mão, pela aba
# Actions). Coleta só aquela fonte com o coletor completo (texto inteiro
# via trafilatura, plano B do Google Notícias) e já classifica, sem
# esperar a próxima coleta de hora em hora.
on:
  workflow_dispatch:
    inputs:
      fonte_id:
        description: "id do feed (feeds.id) ou da fonte (sources.id). Vazio = todos os feeds que ainda não têm artigos"
        required: false
        default: ""

concurrency:
  group: fonte-nova-${{ inputs.fonte_id }}
  cancel-in-progress: false

jobs:
  coletar-fonte:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Sites que barram o GitHub vêm pelo Worker do Cloudflare (coletor/rede.py)
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      FONTE_ID: ${{ inputs.fonte_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      # Com o spaCy (nomes da classificação)
      - name: Instalar dependências
        # versões fixas em constraints.txt (auditoria de 20/10)
        run: pip install -r requirements-nlp.txt -c constraints.txt

      # FONTE_ID entra por variável de ambiente, nunca colado no comando:
      # assim um valor estranho no input não vira comando no shell
      - name: Coletar a fonte
        working-directory: coletor
        run: |
          if [ -n "$FONTE_ID" ]; then
            python coletar.py --fonte "$FONTE_ID"
          else
            python coletar.py --sem-artigos
          fi

      - name: Enriquecer (texto completo e imagem)
        working-directory: coletor
        run: |
          if [ -n "$FONTE_ID" ]; then
            python enriquecer.py --fonte "$FONTE_ID"
          else
            python enriquecer.py
          fi
        continue-on-error: true

      - name: Limpar textos
        working-directory: coletor
        run: |
          if [ -n "$FONTE_ID" ]; then
            python limpar_textos.py --fonte "$FONTE_ID" --dias 30
          else
            python limpar_textos.py
          fi
        continue-on-error: true

      # Sem IA (sql/044): a IA só resume o que vai pro e-mail
      - name: Classificar (sem IA)
        working-directory: coletor
        run: python classificar.py
        timeout-minutes: 5
