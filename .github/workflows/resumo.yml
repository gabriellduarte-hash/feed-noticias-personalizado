name: Resumo diário

# De hora em hora: envia o resumo pra quem escolheu aquele horário em
# Configurações > Resumo diário (o enviar.py decide quem; cada pessoa
# recebe uma vez por dia). Minuto 5, logo depois da virada da hora.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: resumo
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # A IA só entra aqui (sql/044): resume as 10 notícias de cada e-mail
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Foto de capa do e-mail (opcional: sem ela, o e-mail sai sem foto)
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: Instalar dependências
        # versões fixas em constraints.txt (auditoria de 20/10)
        run: pip install -r requirements.txt -c constraints.txt

      - name: Enviar resumos do horário
        working-directory: envio
        run: python enviar.py
